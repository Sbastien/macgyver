# GitHub Pages renders README.md as the site. That is the whole configuration.
#
# There used to be a docs/index.html here — a thousand lines that fetched the
# Brewfile in the browser and re-rendered it as cards, which meant the Brewfile
# had to carry `@icon:` annotations and a validator had to check them. The page
# said what the README already said, and cost three files to keep saying it.
#
# Deploy from a branch (main / root), not a workflow: Jekyll is built into
# Pages, so there is nothing to run and nothing to keep up to date.
title: Brewfile
description: My macOS dev environment, in one file.
theme: jekyll-theme-cayman
