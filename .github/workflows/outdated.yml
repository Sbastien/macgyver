name: Check Deprecated Packages

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-deprecated:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for deprecated packages
        run: |
          echo "### Deprecated Package Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          found_deprecated=false

          # Extract package names from Brewfile
          while IFS= read -r line; do
            # Match brew "package" or cask "package"
            if [[ "$line" =~ ^(brew|cask)[[:space:]]+\"([^\"]+)\" ]]; then
              pkg="${BASH_REMATCH[2]}"

              # Check if deprecated or disabled
              info=$(brew info "$pkg" 2>/dev/null || true)
              if echo "$info" | grep -qi "deprecated\|disabled"; then
                echo "::warning::Package $pkg may be deprecated"
                echo "- ⚠️ \`$pkg\` may be deprecated" >> $GITHUB_STEP_SUMMARY
                found_deprecated=true
              fi
            fi
          done < Brewfile

          if [ "$found_deprecated" = false ]; then
            echo "✅ No deprecated packages found" >> $GITHUB_STEP_SUMMARY
          fi
