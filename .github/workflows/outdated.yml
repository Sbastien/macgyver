name: Check Deprecated Packages

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-deprecated:
    name: Deprecated packages
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Ensure jq is available
        run: command -v jq >/dev/null || brew install jq

      # Queries the JSON API once for the whole Brewfile. The previous version
      # ran `brew info` per package and grepped its prose for "deprecated",
      # which also matched packages merely mentioning the word.
      #
      # This step fails when something is deprecated, so the scheduled run
      # notifies instead of hiding the result in a job summary nobody reads.
      - name: Check for deprecated or disabled packages
        run: ./bin/check-deprecated
