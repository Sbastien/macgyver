name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the shellcheck and shfmt versions pinned in mise.toml, so CI
      # and a local `mise run lint` cannot disagree about what is correct.
      - name: Setup mise
        uses: jdx/mise-action@v4.2.3

      - name: Lint
        run: mise run lint
