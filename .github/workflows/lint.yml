name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./docs
          severity: warning

      - name: shfmt
        uses: mvdan/sh@v0.14.0
        with:
          sh-checker: true
          sh-checker-args: -i 4 -ci -d ./docs/*.sh
