name: Validate Brewfile

on:
  push:
    branches: [main]
    # Duplicated below on purpose: GitHub Actions does not support YAML anchors.
    paths:
      - 'Brewfile'
      - 'profiles/**'
      - 'bin/validate'
      - 'bin/generate'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'Brewfile'
      - 'profiles/**'
      - 'bin/validate'
      - 'bin/generate'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The root Brewfile is generated from profiles/. This fails if someone
      # edited it by hand or changed a profile without regenerating.
      - name: Check the generated Brewfile is current
        run: ./bin/generate --check

      # Same scripts as `mise run validate`, so a green CI run means the same
      # checks that pass locally. The previous workflow ended its syntax step
      # with `|| true` and was green regardless of outcome.
      - name: Validate the root Brewfile
        run: ./bin/validate Brewfile

      - name: Validate each profile
        run: |
          for profile in profiles/*.Brewfile; do
            ./bin/validate "$profile"
          done
