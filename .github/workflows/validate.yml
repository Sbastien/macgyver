name: Validate Brewfile

on:
  push:
    branches: [main]
    paths:
      - 'Brewfile'
      - 'bin/validate'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'Brewfile'
      - 'bin/validate'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same script as `mise run validate`, so a green CI run means the same
      # checks that pass locally. It exits non-zero on failure; the previous
      # workflow ended its syntax step with `|| true` and was always green.
      - name: Validate
        run: ./bin/validate
