name: Validate Brewfile

on:
  push:
    branches: [main]
    # Duplicated below on purpose: GitHub Actions does not support YAML anchors.
    paths:
      - 'Brewfile'
      - 'bin/validate'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'Brewfile'
      - 'bin/validate'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same script as `mise run validate`, so a green CI run means the same
      # checks that pass locally. The previous workflow ended its syntax step
      # with `|| true` and was green regardless of outcome.
      - name: Validate
        run: ./bin/validate Brewfile
