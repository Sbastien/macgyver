# Development tooling for this repository.
#
# Versions are pinned so that a local run and a CI run check exactly the same
# thing. CI installs these with jdx/mise-action instead of piping an unpinned
# third-party installer script into a shell.

[tools]
shellcheck = "0.11.0"
shfmt = "3.13.1"

[tasks.validate]
description = "Validate the Brewfile: syntax, duplicates, conventions"
run = "./bin/validate"

[tasks."check:deprecated"]
description = "Report Brewfile packages Homebrew has deprecated or disabled"
run = "./bin/check-deprecated"

[tasks.lint]
description = "Lint and format-check shell scripts"
run = [
    "shellcheck bin/* docs/*.sh",
    "shfmt -i 4 -ci -d bin/* docs/*.sh",
]

[tasks.fmt]
description = "Format shell scripts in place"
run = "shfmt -i 4 -ci -w bin/* docs/*.sh"
