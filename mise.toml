# mise plays two separate roles in this repository.
#
#   [tools]   mise installs these itself. Only the tooling this repo needs to
#             lint and check itself. Pinned so a local run and a CI run check
#             exactly the same thing.
#
#   [tasks]   mise runs these. It is a task runner here, nothing more — the
#             install tasks below shell out to `brew bundle`. mise never
#             installs a Homebrew package.

[tools]
shellcheck = "0.11.0"
shfmt = "3.13.1"

# -----------------------------------------------------------------------------
# Installing packages — these call Homebrew, they do not use mise's own tooling
# -----------------------------------------------------------------------------

[tasks.install]
description = "Install everything in the Brewfile"
run = "brew bundle install --file=Brewfile"

# -----------------------------------------------------------------------------
# Repository maintenance
# -----------------------------------------------------------------------------

[tasks.doctor]
description = "Audit this machine against the Brewfile (read-only)"
run = "./bin/doctor"

[tasks.lint]
description = "Lint and format-check shell scripts"
run = [
    "shellcheck bin/doctor install.sh",
    "shfmt -i 4 -ci -d bin/doctor install.sh",
]

[tasks.fmt]
description = "Format shell scripts in place"
run = "shfmt -i 4 -ci -w bin/doctor install.sh"

# A parse accepts `brew "ripgrp"` and exits 0, so a typo would first surface
# on a bare Mac. Asking Homebrew to resolve every name costs two seconds.
# It will not catch a rename: `cask "docker"` still resolves years on.
[tasks.check]
description = "Parse the Brewfile and resolve every package against Homebrew"
run = [
    "brew bundle list --all --file=Brewfile >/dev/null",
    "brew bundle list --formulae --file=Brewfile | xargs brew info --formula --json=v2 >/dev/null",
    "brew bundle list --casks --file=Brewfile | xargs brew info --cask --json=v2 >/dev/null",
]

# One name for the whole gate, so ci.yml cannot drift from the local run.
[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "check"]
